name: Quiz Prêt - publier
on:
  push:
    paths: ['scripts/quiz_new.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Questions dans Firebase
        run: pip install -q firebase-admin && python3 scripts/quiz_publish.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
