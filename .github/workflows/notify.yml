name: Notifications
on:
  schedule:
    - cron: '*/5 * * * *'
    # 20h Beyrouth (hiver UTC+2 / été UTC+3), en plus du passage toutes les 5 min que GitHub espace souvent
    - cron: '7 17 * * *'
    - cron: '7 18 * * *'
    - cron: '21 18 * * *'
    # 7h Beyrouth : phrase du saint du jour (hiver UTC+2 / été UTC+3)
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
    - cron: '19 5 * * *'
  workflow_dispatch:
    inputs:
      verify:
        description: 'Tester la clé seulement'
        default: '0'
      title:
        description: 'Titre (message manuel à tout le monde)'
        default: ''
      body:
        description: 'Message'
        default: ''
      page:
        description: 'Page du site, ex. #uni'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Envoyer les notifications
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          VERIFY: ${{ inputs.verify }}
          MSG_TITLE: ${{ inputs.title }}
          MSG_BODY: ${{ inputs.body }}
          MSG_PAGE: ${{ inputs.page }}
        run: python3 scripts/notify.py
      - name: Enregistrer l'état
        run: |
          if [ -n "$(git status --porcelain data/notif-state.json)" ]; then
            git config user.name "troupe-bot"
            git config user.email "troupe-bot@users.noreply.github.com"
            git add data/notif-state.json
            git commit -m "Notifications : état [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - name: Relancer aussi « Supprimer les comptes retirés » (modifs admin, galerie, saints)
        if: github.event_name == 'workflow_dispatch' && inputs.title == '' && inputs.verify != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run delete-accounts.yml --ref main -R ${{ github.repository }} || true
