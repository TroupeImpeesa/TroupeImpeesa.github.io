name: Quiz vers Firebase
on:
  push:
    paths: ['.github/workflows/quiz-to-firebase.yml']
permissions:
  contents: read
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q firebase-admin && python3 scripts/quiz_to_firebase.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
