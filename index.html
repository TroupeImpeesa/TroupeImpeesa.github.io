/* ===== Design B : moderne minimal ===== */
:root{--bg:#ffffff;--surface:#f5f5f7;--fg:#111111;--muted:#6e6e73;--line:#e6e6ea;--accent:#1e4636;--accent-ink:#ffffff;--soft:#f5f5f7;--pending:#ececef;--ember:#1e4636;--display:"Inter",system-ui,-apple-system,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
body{font-family:var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,.tname,.gname,.pname2,.ghero .gname{font-family:var(--display);font-weight:800;letter-spacing:-.025em}
h2{font-size:22px;margin:26px 0 12px}
header.top{margin:12px 0 0;border-radius:24px;overflow:hidden;min-height:270px;padding:22px}
header.top h1{font-size:clamp(28px,8vw,40px);text-shadow:none}
header.top .eyebrow{letter-spacing:.16em;font-weight:600;text-shadow:none}
.hero .shade{background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.65))}
.tabbar{height:6px}
.meta{color:var(--muted)}
/* cards: soft grey, no borders */
.news li,.event,.evinfo div,.evlist li,.plist li,.stat,.scout,.ptwrap,.soonbox,.editbox{border:none;background:var(--surface);border-radius:18px;box-shadow:none}
.news li{padding:14px 16px}
.ndate{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
/* date block */
.cal{border:none;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.evgo{font-size:22px}

.cal.big{background:#fff;border:none;color:var(--fg)}

.evlist li::before{background:var(--accent)}
/* back button */
.back{border:none;background:none;box-shadow:none;padding:4px 0;gap:10px;margin:14px 0 4px}
.bico{width:34px;height:34px;background:#fff;color:var(--fg);border:1px solid var(--line)}
/* tiles */

.tile{align-items:flex-start;text-align:left;gap:0;padding:16px;border-radius:18px;background:var(--surface);box-shadow:none}
.tile .tcirc{width:40px;height:40px;border-radius:12px;font:800 17px var(--display);color:#fff;box-shadow:none;margin-bottom:14px}
.tile .tname{font-size:17px}
.tcount{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.tile.wide{align-items:center;padding:14px 16px}
.tile.wide .tcirc{width:40px;height:40px;font-size:17px;margin:0}
.tile .tsub{display:block;font:400 13px var(--body);color:var(--muted);letter-spacing:0;margin-top:2px}
.faces{display:flex;margin-left:auto;padding-left:6px}
.faces img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);margin-left:-8px}
.navgrid{margin-top:22px}

/* group view */

.ghero .tcirc{width:56px;height:56px;border-radius:16px;font:800 24px var(--display);color:#fff;box-shadow:none}

.gcount{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.mcard{background:var(--surface);box-shadow:none;border-radius:16px}
.mcard .av,.grp .av{box-shadow:none}
.mtag.role{background:var(--fg)}
/* leaderboard: one grouped list */
.board{gap:0;background:var(--surface);border-radius:18px;overflow:hidden}
.row{border:none;border-radius:0;background:transparent;padding:13px 16px;grid-template-columns:24px 1fr auto}
.row+.row{border-top:1px solid var(--line)}

/* profile */
.phero{border-radius:20px}

.lpn{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.lpn b{font-size:26px;font-weight:800;letter-spacing:-.02em}.lpn span{font-size:13px;color:var(--muted)}
.lpbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.lpbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.mcard{position:relative}

.hyear{margin-top:18px}
.hylab{font-weight:800;font-size:15px;letter-spacing:-.01em;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.hnow{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;letter-spacing:0}
.hrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.hcard{--gc:var(--navy);padding:12px 4px 10px}
.hcard .mname{font-size:12px}
.mtag.hct{font-weight:700;color:var(--fg)}

.cpmb{padding:0 14px 14px;display:grid;gap:8px}
.cpmb .lbl{color:var(--muted);font-size:12px;font-weight:600;margin-top:4px}
.blist{display:grid;gap:2px;max-height:340px;overflow:auto;background:#fff;border-radius:12px;padding:6px}
.bitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;font-size:14px;cursor:pointer}
.bitem.on{background:#e8f1ec;font-weight:600}
.bitem input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.cpin{flex:1}
.cpsave{position:sticky;bottom:0;z-index:6;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cpsave .msg{flex:1;font-size:13px;color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:12px;padding:10px}
.pinfo .lbl{margin:0;font-size:12px}
.pinfo .lbl:first-child{grid-column:1/-1}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/|www\.)[^\s<]*[^\s<.,;:!?)\]'"]/g,function(u){var h=/^https?:/.test(u)?u:'https://'+u;var im=h.match(/troupeimpeesa\.github\.io\/?(?:\?[^#]*)?#(\w+)/);if(im){var nm={home:'Accueil',progress:'Troupe',events:'Calendrier',history:'Histoire',quiz:'Quiz Prêt'}[im[1]];if(nm)return '<a class="inlink" href="#'+im[1]+'">'+nm+' ›</a>'}return '<a href="'+h+'" target="_blank" rel="noopener">'+u+'</a>'})}
function evEnd(e){return e.endDate&&e.endDate>e.date?e.endDate:e.date}
function evOver(e){var d=new Date(),now=today()+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return now>evEnd(e)+'T'+(e.end||'23:59')}

function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function klbp(k){var i=coopItem(k.split('|')[0]);return i&&i.lbp?i.lbp:0}

function pmoney(i,q){q=q||1;return i&&i.lbp?lbp(i.lbp*q):money((i?i.price:0)*q)}

function tmoney(u,l){return (u||!l?money(u):'')+(l?(u?' + ':'')+lbp(l):'')}

function tordTick(d){
 var k=d.tb||d.tr||d.tball||d.trall,a=tordAgg()[k];if(!a)return;
 if(d.tb||d.tr){var w=a.who.filter(function(x){return x.uid===d.u})[0];if(!w)return;
  if(d.tb){var on=w.d<w.q;tordSet([{w:w,k:k,b:on,r:on?null:false}])}
  else{var on2=w.r<w.q;tordSet([{w:w,k:k,r:on2,b:on2?true:null}])}return}
 if(d.tball)tordSet(a.who.filter(function(w){return w.d<w.q}).map(function(w){return {w:w,k:k,b:true}}));
 if(d.trall)tordSet(a.who.filter(function(w){return w.r<w.q}).map(function(w){return {w:w,k:k,b:true,r:true}}));
}

function acnEnc(pw,obj){
 var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),IT=250000;
 function b(x){var s='',a=new Uint8Array(x);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
 return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey'])
  .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt'])})
  .then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)))})
  .then(function(ct){return {salt:b(salt),iv:b(iv),ct:b(ct),it:IT}});
}
function acnKeys(u,pw,role,patrol){

 var dk=role==='Maîtrise'?ACCK.dk:{},scope=role==='Maîtrise'?'chef':patrol;if(role!=='Maîtrise')dk[patrol]=ACCK.dk[patrol];
 function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+ACCK.token,'Content-Type':'application/json'}}
 var url='https://api.github.com/repos/'+REPO+'/contents/data/keys.json';
 return Promise.all([fetch(url+'?ref=main',{headers:hdr(),cache:'no-store'}).then(function(r){if(!r.ok)throw r.status;return r.json()}),acnEnc(pw,{token:ACCK.token,dk:dk,scope:scope})]).then(function(r){
  var K=JSON.parse(b64d(r[0].content));K['u:'+u]=r[1];
  return fetch(url,{method:'PUT',headers:hdr(),body:JSON.stringify({message:'Compte '+u+' : accès Espace CP/SP',content:b64e(JSON.stringify(K,null,1)),sha:r[0].sha,branch:'main'})}).then(function(x){if(!x.ok)throw x.status})});
}

 }).then(function(L){

function exportPDF(id){
 var s=S.scouts.filter(function(x){return x.id===id})[0];if(!s)return;
 var btn=document.querySelector('[data-pdf]');if(btn){btn.disabled=true;btn.querySelector('span').textContent='Préparation…'}
 function done(){if(btn){btn.disabled=false;btn.querySelector('span').textContent='Exporter en PDF'}}
 loadPdfLib().then(function(){
  var holder=document.createElement('div');holder.style.cssText='position:fixed;left:0;top:0;width:794px;height:1122px;z-index:-5;pointer-events:none;overflow:hidden';holder.innerHTML=pdfSheet(s);document.body.appendChild(holder);
  var el=holder.querySelector('.pdfx');
  return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
   return html2pdf().set({margin:0,filename:'Fiche - '+s.name+'.pdf',image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',x:0,y:0,scrollX:0,scrollY:0,width:794,height:1122,windowWidth:794,windowHeight:1122},jsPDF:{unit:'px',format:[794,1123],orientation:'portrait',hotfixes:['px_scaling']},pagebreak:{mode:[]}}).from(el).save();
  }).then(function(){holder.remove();done()},function(e){holder.remove();throw e});
 }).catch(function(){done();alertless('Export impossible. Vérifie ta connexion et réessaie.')});
}
function alertless(t){var b=document.querySelector('[data-pdf]');if(b){b.querySelector('span').textContent=t;setTimeout(function(){b.querySelector('span').textContent='Exporter en PDF'},3500)}}

var pts={ok:false,token:null,busy:false,dirty:false,msg:'',err:'',sha:null,backup:null,open:false};
function ptsLock(){if(typeof pts==='undefined'||!pts)return;if(pts.dirty&&pts.backup)S.log=pts.backup;pts.ok=false;pts.token=null;pts.busy=false;pts.dirty=false;pts.msg='';pts.err='';pts.sha=null;pts.backup=null;pts.open=false}
function ptsGh(path,opt){opt=opt||{};opt.headers={'Accept':'application/vnd.github+json'};if(pts.token)opt.headers.Authorization='Bearer '+pts.token;if(opt.body)opt.headers['Content-Type']='application/json';opt.cache='no-store';return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,opt)}
function ptsLoad(){
 pts.busy=true;pts.err='';render();
 ptsGh('data/points.json?ref=main').then(function(r){if(r.status===404)return null;if(!r.ok)throw r.status;return r.json()}).then(function(j){
  pts.sha=j?j.sha:null;if(j){try{var d=JSON.parse(b64d(j.content));if(Array.isArray(d.log))S.log=d.log}catch(e){}}
  pts.backup=JSON.parse(JSON.stringify(S.log));pts.ok=true;pts.busy=false;pts.dirty=false;pts.msg='';render()})
 .catch(function(){pts.busy=false;pts.err='Impossible de charger. Vérifie ta connexion et réessaie.';render()});
}
function ptsSave(retry){
 pts.busy=true;pts.err='';pts.msg='Enregistrement…';render();
 var body={message:'Points : mise à jour ('+today()+')',content:b64e(JSON.stringify({log:S.log},null,1)),branch:'main'};if(pts.sha)body.sha=pts.sha;
 ptsGh('data/points.json',{method:'PUT',body:JSON.stringify(body)}).then(function(r){
  if((r.status===409||r.status===422)&&!retry){return ptsGh('data/points.json?ref=main').then(function(x){return x.ok?x.json():null}).then(function(j){pts.sha=j?j.sha:null;return ptsSave(true)})}
  if(!r.ok)throw r.status;return r.json().then(function(j){pts.sha=j.content.sha;pts.busy=false;pts.dirty=false;pts.backup=JSON.parse(JSON.stringify(S.log));pts.msg='Enregistré ✓ Visible par tous dans 1 à 2 minutes.';render()})})
 .catch(function(e){pts.busy=false;pts.msg='';pts.err=e===401?'Le mot de passe a expiré. Reconnecte-toi.':'Échec de l’enregistrement. Vérifie ta connexion et réessaie.';render()});
}
function ptsTop(){
 if(!CP_ON||editing)return '';
 if(pts.ok)return '';
 if(!(ACCK&&ACCK.scope==='chef'))return '';
 if(!pts.busy&&!pts.err){pts.busy=true;setTimeout(function(){pts.token=ACCK.token;ptsLoad()},0)}
 return pts.err?'<p class="cperr">'+esc(pts.err)+'</p>':'';
 if(!pts.open)return '<button class="cpbtn" data-act="ptsacc" style="margin-top:12px"><span class="cpic">'+LOCK+'</span><span class="cptx"><b>Modifier les points</b><span>Réservé aux chefs</span></span><span class="evgo" aria-hidden="true">›</span></button>';
 return '<div class="cpcard"><p class="cplead">Entre le mot de passe pour modifier les points.</p><div class="fields"><input id="pts-pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Mot de passe" aria-label="Mot de passe"><button class="btn" data-act="ptsunlock"'+(pts.busy?' disabled':'')+'>'+(pts.busy?'Vérification…':'Ouvrir')+'</button></div>'+(pts.err?'<p class="cperr">'+esc(pts.err)+'</p>':'')+'</div>';
}
function ptsBar(){return pts.ok&&!editing?'<div class="cpsave"><span class="msg'+(pts.err?' cperr':'')+'" role="status">'+esc(pts.err||pts.msg||(pts.dirty?'Modifications non enregistrées':'Tout est enregistré'))+'</span><button class="btn" data-act="ptssave"'+(pts.dirty&&!pts.busy?'':' disabled')+'>'+(pts.busy?'Enregistrement…':'Enregistrer')+'</button></div>':''}
function ptsClick(b){
 var a=b.dataset.act;
 if(a==='ptsacc'){if(ACCK&&ACCK.scope==='chef'){pts.token=ACCK.token;ptsLoad()}return true}
 if(a==='ptsopen'){pts.open=true;pts.err='';render();var i=document.getElementById('pts-pw');if(i)i.focus();return true}
 if(a==='ptsunlock'){var pw=val('pts-pw').toLowerCase().replace(/[\s‐-―−]+/g,function(x){return /\s/.test(x)?'':'-'});if(!pw)return true;pts.busy=true;pts.err='';render();
  unlock(pw,'pts').then(function(x){if(!x.token)throw 'notok';if(x.scope!=='pts'&&x.scope!=='chef')throw 'bad';pts.token=x.token;pts.busy=false;ptsLoad()})
   .catch(function(e){pts.busy=false;pts.err=e==='nokeys'?'Pas encore activé.':'Mot de passe incorrect.';render()});return true}
 if(a==='ptssave'){ptsSave(false);return true}
 return false;
}
