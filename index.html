/* ===== Design B : moderne minimal ===== */
:root{--bg:#ffffff;--surface:#f5f5f7;--fg:#111111;--muted:#6e6e73;--line:#e6e6ea;--accent:#1e4636;--accent-ink:#ffffff;--soft:#f5f5f7;--pending:#ececef;--ember:#1e4636;--display:"Inter",system-ui,-apple-system,sans-serif;--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}

.hrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}

<script id="main">
(function(){
function load(){var x=JSON.parse(document.getElementById('state').textContent);x.meetings=x.meetings||[];x.photos=x.photos||[];x.news=x.news||[];x.faces=x.faces||{};return x}
var S=load(),curM=null,slide=0,openScout=null,openEvent=null;
var TABS=['home','progress','events','history'];
var tab='home',openGroup=null,openPts=null;
function route(h){h=(h==null?(location.hash||'#home').slice(1):h).split('/');var t=h[0]==='points'?'progress':h[0];if(TABS.indexOf(t)<0)t='home';tab=t;openGroup=null;openPts=null;openScout=null;openEvent=null;openCP=null;var x=h[1]||'';
 if(t==='progress'){if(x.indexOf('g-')===0)openGroup=x.slice(2);else if(x.indexOf('cp-')===0&&pat(x.slice(3))){openCP=x.slice(3);openGroup=openCP}else if(x.indexOf('pts-')===0)openPts=x.slice(4);else if(x.indexOf('s-')===0){var sc=S.scouts.filter(function(q){return q.id===x.slice(2)})[0];if(sc){openScout=sc.id;openGroup=sc.patrol}}}
 if(x.indexOf('e-')===0&&S.events.some(function(e){return e.id===x.slice(2)}))openEvent=x.slice(2);
 if(!openCP)cpLock()}
function go(h){try{history.pushState({ia:1},'','#'+h)}catch(e){}route(h);render()}
function closeView(){if(history.state&&history.state.ia){history.back();return}var h=tab;if((openScout||openCP)&&openGroup)h='progress/g-'+openGroup;try{history.replaceState(null,'','#'+h)}catch(e){}route(h);render()}
route();
var prevTab=tab;
var editing=false, dirty=false, canEdit=false, full=false, saving=false, artifactNs=null, msg='';
var MONTHS=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/|www\.)[^\s<]*[^\s<.,;:!?)\]'"]/g,function(u){var h=/^https?:/.test(u)?u:'https://'+u;var im=h.match(/troupeimpeesa\.github\.io\/?(?:\?[^#]*)?#(\w+)/);if(im){var nm={home:'Accueil',progress:'Troupe',events:'Calendrier',history:'Histoire'}[im[1]];if(nm)return '<a class="inlink" href="#'+im[1]+'">'+nm+' ›</a>'}return '<a href="'+h+'" target="_blank" rel="noopener">'+u+'</a>'})}
function evEnd(e){return e.endDate&&e.endDate>e.date?e.endDate:e.date}
function span(e){var z=evEnd(e);if(z===e.date)return '';var a=e.date.split('-'),b=z.split('-');return a[1]===b[1]?(+a[2])+'–'+(+b[2])+' '+MONTHS[+b[1]-1]:fmtDate(e.date)+' – '+fmtDate(z)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pat(id){return S.patrols.filter(function(p){return p.id===id})[0]}
function col(p){return 'var(--p'+((p&&p.c)||1)+')'}
function fmtDate(d){var p=d.split('-');return +p[2]+' '+MONTHS[+p[1]-1]}
function totals(){var t={};S.patrols.forEach(function(p){t[p.id]=0});S.log.forEach(function(l){if(l.patrol in t)t[l.patrol]+=Number(l.pts)||0});return t}
var DKEYS=['troop','season','patrols','log','events','photos','news','cover','faces','staff'],draftAvail=false;
function pick(o){var r={};DKEYS.forEach(function(k){r[k]=o[k]});return JSON.stringify(r)}
function saveDraft(){try{localStorage.setItem('ti-draft',pick(S))}catch(e){}}
function readDraft(){try{return localStorage.getItem('ti-draft')}catch(e){return null}}
function dropDraft(){draftAvail=false;try{localStorage.removeItem('ti-draft')}catch(e){}}
function touch(){dirty=true;S.example=S.example&&true;if(canEdit)saveDraft();render()}

var firstPick=true,LOADED={},assetsNs=null;
function slideImg(i){var el=document.getElementById('show');return el?el.querySelectorAll('img')[i]:null}
function preload(i){var im=slideImg(i);LOADED[i]=true;if(im&&!im.getAttribute('src')&&im.dataset.src)im.src=im.dataset.src;return im}
function heroTop(){
 var P=S.photos,txt='<div class="htext"><div class="eyebrow">'+esc(S.season)+'</div><h1>'+esc(S.troop)+'</h1></div>';
 if(!P.length) return '<header class="top"'+(S.cover?' style="background-image:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.7)),url('+S.cover+')"':'')+'>'+txt+'</header>';
 if(firstPick){slide=Math.floor(Math.random()*P.length);firstPick=false}
 if(slide>=P.length) slide=0;
 LOADED[slide]=true;
 return '<header class="top hero" id="show">'+P.map(function(ph,i){return '<img '+(LOADED[i]?'src':'data-src')+'="'+ph.src+'" alt="'+esc(ph.caption||'Photo de la troupe')+'" class="'+(i===slide?'on':'')+'"'+(i===slide?' fetchpriority="high"':' decoding="async"')+'>'}).join('')+'<div class="shade"></div>'+txt+
  '</header>'}
function header(){return heroTop()+
 '<div class="tabbar"></div>'+
 (canEdit&&draftAvail?'<div class="note draftbar"><span>Tu as des modifications non publiées.</span><span><button class="btn" data-act="restore">Récupérer</button> <button class="btn ghost" data-act="nodraft">Ignorer</button></span></div>':'')+
 (S.example?'<div class="note">Les points affichés sont des exemples. '+(canEdit?'Appuie sur <b>Modifier</b> pour les remplacer par les vrais.':'Les chefs ajouteront bientôt les vrais.')+'</div>':'')}

function slideshow(){
 var P=S.photos;
 if(!P.length) return '<div class="show empty-show">Les photos de la troupe apparaîtront ici.</div>';
 if(slide>=P.length) slide=0;
 return '<div class="show" id="show">'+P.map(function(ph,i){return '<img src="'+ph.src+'" alt="'+esc(ph.caption||'Photo de la troupe')+'" class="'+(i===slide?'on':'')+'">'}).join('')+
  '<div class="cap" id="show-cap">'+esc(P[slide].caption||'')+'</div>'+
  (P.length>1?'<div class="sdots">'+P.map(function(ph,i){return '<button data-slide="'+i+'" class="'+(i===slide?'on':'')+'" aria-label="Photo '+(i+1)+'"></button>'}).join('')+'</div>':'')+'</div>'}
var ORDER=[],OPOS=0;
function reshuffle(){var n=S.photos.length,a=[];for(var i=0;i<n;i++)a.push(i);for(var j=n-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t}if(n>1&&a[0]===slide){var t2=a[0];a[0]=a[n-1];a[n-1]=t2}ORDER=a;OPOS=0}
