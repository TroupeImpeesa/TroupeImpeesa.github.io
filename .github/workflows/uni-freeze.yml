name: Figer Université
on:
  push:
    paths: ['.github/workflows/uni-freeze.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/uni_freeze.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/points.json; git commit -m "Points Université figés" || true
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
