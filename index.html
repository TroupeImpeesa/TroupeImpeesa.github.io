<style>
/* Layout: camp-noticeboard header, three tabs (Points / Progress / Events), single column ~720px */

.srow{box-sizing:border-box}

.evlink{cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;align-items:center}
.evlink:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.evgo{font-size:26px;color:var(--muted);line-height:1}
.evhero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:var(--fg);color:var(--bg);margin-top:6px}
.evhero .pname2{color:var(--bg)}
.cal.big{width:76px;flex:none;border-color:var(--bg);background:var(--bg);color:var(--fg)}
.cal.big b{background:var(--ember);color:#fff}
.cal.big span{font-size:32px}
.evinfo{display:grid;gap:8px;margin-top:12px}
.evinfo div{display:flex;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.evinfo span{color:var(--muted);font-size:14px}
.evinfo b{text-align:right;min-width:0;overflow-wrap:anywhere}
.evlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.evlist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 34px;position:relative;font-weight:700}
.evlist li::before{content:"";position:absolute;left:14px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--accent)}
.lbl{display:grid;gap:4px;font-size:13px;color:var(--muted);flex:1 1 140px}
textarea{resize:vertical;font:16px var(--body)}
.herd{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.hrun{position:absolute;left:0;transform:translateX(100vw);animation-name:herdrun;animation-timing-function:linear;animation-fill-mode:forwards}
.hbob{display:inline-block;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:gallop .26s ease-in-out infinite alternate}
.htag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 18px var(--body);color:#fff;padding:8px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:tagpop 3.4s ease forwards}
@keyframes herdrun{from{transform:translateX(100vw)}to{transform:translateX(-160px)}}
@keyframes gallop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-14px) rotate(4deg)}}
@keyframes tagpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.herd{display:none}}
.empty{color:var(--muted);padding:16px 0}
.igcard{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--fg);text-decoration:none;-webkit-tap-highlight-color:transparent}
.igcard .igic{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--fg);color:var(--bg)}
.igcard b{display:block;font-size:16px}
.igcard .meta{display:block}
.igcard .evgo{margin-left:auto}
@media (prefers-reduced-motion:no-preference){.igcard{transition:transform .15s}.igcard:active{transform:scale(.98)}}
.soonbox{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-top:14px;padding:44px 20px;border-radius:22px;background:var(--surface);border:1px dashed var(--line)}
.soonbox .tcirc{background:var(--navy)}
.soonbox b{font-family:var(--display);font-size:22px}
.soonbox span{color:var(--muted)}
/* edit UI */
.editbox{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;display:grid;gap:10px}
.editbox h4{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fields{display:flex;flex-wrap:wrap;gap:8px}
.fields>*{flex:1 1 140px;min-width:0}
input,select,textarea{font:16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.btn{font:700 15px var(--body);padding:9px 14px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer;flex:0 0 auto}
.btn.ghost{background:transparent;color:var(--fg)}
.x{border:none;background:none;color:var(--danger);font:700 18px var(--body);cursor:pointer;padding:0 4px;line-height:1}
.inline-sel{width:auto;padding:4px 6px;font-size:14px}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:10}
.savebar .msg{color:var(--muted);font-size:14px}
.editbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>

<script id="main">
(function(){
function load(){var x=JSON.parse(document.getElementById('state').textContent);x.meetings=x.meetings||[];x.photos=x.photos||[];x.news=x.news||[];x.faces=x.faces||{};return x}
var S=load(),curM=null,slide=0,openScout=null,openEvent=null;
var TABS=['home','progress','events','history'];
var tab='home',openGroup=null,openPts=null;
function route(h){h=(h==null?(location.hash||'#home').slice(1):h).split('/');var t=h[0]==='points'?'progress':h[0];if(TABS.indexOf(t)<0)t='home';tab=t;openGroup=null;openPts=null;openScout=null;openEvent=null;var x=h[1]||'';
 if(t==='progress'){if(x.indexOf('g-')===0)openGroup=x.slice(2);else if(x.indexOf('pts-')===0)openPts=x.slice(4);else if(x.indexOf('s-')===0){var sc=S.scouts.filter(function(q){return q.id===x.slice(2)})[0];if(sc){openScout=sc.id;openGroup=sc.patrol}}}
 if(x.indexOf('e-')===0&&S.events.some(function(e){return e.id===x.slice(2)}))openEvent=x.slice(2)}
function go(h){try{history.pushState({ia:1},'','#'+h)}catch(e){}route(h);render()}
function closeView(){if(history.state&&history.state.ia){history.back();return}var h=tab;if(openScout&&openGroup)h='progress/g-'+openGroup;try{history.replaceState(null,'','#'+h)}catch(e){}route(h);render()}
route();
var prevTab=tab;
var editing=false, dirty=false, canEdit=false, full=false, saving=false, artifactNs=null, msg='';
var MONTHS=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/|www\.)[^\s<]*[^\s<.,;:!?)\]'"]/g,function(u){var h=/^https?:/.test(u)?u:'https://'+u;return '<a href="'+h+'" target="_blank" rel="noopener">'+u+'</a>'})}
function evEnd(e){return e.endDate&&e.endDate>e.date?e.endDate:e.date}
function span(e){var z=evEnd(e);if(z===e.date)return '';var a=e.date.split('-'),b=z.split('-');return a[1]===b[1]?(+a[2])+'–'+(+b[2])+' '+MONTHS[+b[1]-1]:fmtDate(e.date)+' – '+fmtDate(z)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pat(id){return S.patrols.filter(function(p){return p.id===id})[0]}
function col(p){return 'var(--p'+((p&&p.c)||1)+')'}
function fmtDate(d){var p=d.split('-');return +p[2]+' '+MONTHS[+p[1]-1]}
function totals(){var t={};S.patrols.forEach(function(p){t[p.id]=0});S.log.forEach(function(l){if(l.patrol in t)t[l.patrol]+=Number(l.pts)||0});return t}
var DKEYS=['troop','season','patrols','log','events','photos','news','cover','faces','staff'],draftAvail=false;
function pick(o){var r={};DKEYS.forEach(function(k){r[k]=o[k]});return JSON.stringify(r)}
function saveDraft(){try{localStorage.setItem('ti-draft',pick(S))}catch(e){}}
function readDraft(){try{return localStorage.getItem('ti-draft')}catch(e){return null}}
function dropDraft(){draftAvail=false;try{localStorage.removeItem('ti-draft')}catch(e){}}
function touch(){dirty=true;S.example=S.example&&true;if(canEdit)saveDraft();render()}

var firstPick=true,LOADED={},assetsNs=null;
function slideImg(i){var el=document.getElementById('show');return el?el.querySelectorAll('img')[i]:null}
function preload(i){var im=slideImg(i);LOADED[i]=true;if(im&&!im.getAttribute('src')&&im.dataset.src)im.src=im.dataset.src;return im}
function heroTop(){
 var P=S.photos,txt='<div class="htext"><div class="eyebrow">'+esc(S.season)+'</div><h1>'+esc(S.troop)+'</h1></div>';
 if(!P.length) return '<header class="top"'+(S.cover?' style="background-image:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.7)),url('+S.cover+')"':'')+'>'+txt+'</header>';
 if(firstPick){slide=Math.floor(Math.random()*P.length);firstPick=false}

function lines(t){return String(t||'').split('\n').map(function(x){return x.replace(/^\s*[-•]\s*/,'').trim()}).filter(Boolean)}
function longDate(d){var p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);return DAYS[dt.getDay()]+' '+(+p[2])+' '+MONTHS_FULL[+p[1]-1]}
function evCard(e,isPast,first,noDel){var p=e.date.split('-');return '<div class="event evlink'+(isPast?' past':'')+'" data-event="'+e.id+'" role="button" tabindex="0" aria-label="'+esc(e.title)+'"><div class="cal"><b>'+MONTHS[+p[1]-1]+'</b><span>'+(+p[2])+'</span></div><div style="min-width:0;flex:1">'+(first?'<span class="soon">Prochaine</span>':'')+'<h3>'+esc(e.title)+'</h3><div class="meta">'+[span(e),hours(e),e.place].filter(Boolean).map(esc).join(' · ')+'</div>'+(e.note?'<div style="margin-top:4px">'+linkify(e.note)+'</div>':'')+'</div><span class="evgo" aria-hidden="true">›</span></div>'}
function eventPage(){
 var e=S.events.filter(function(x){return x.id===openEvent})[0]; if(!e) return '';
 var p=e.date.split('-'),bring=lines(e.bring),rem=lines(e.remarks);
 var h='<div class="profile" role="dialog" aria-modal="true" aria-label="'+esc(e.title)+'"><div class="pwrap">'+
  '<button class="back" data-act="closeevent"><span class="bico" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Calendrier</span></button>'+
  '<div class="evhero"><div class="cal big"><b>'+MONTHS[+p[1]-1]+'</b><span>'+(+p[2])+'</span></div><div style="min-width:0"><div class="ptag">'+esc(longDate(e.date)+(evEnd(e)!==e.date?' – '+longDate(evEnd(e)):''))+'</div><h2 class="pname2">'+esc(e.title)+'</h2></div></div>'+
  '<div class="evinfo">'+(hours(e)?'<div><span>Horaire</span><b>'+esc(hours(e))+'</b></div>':'')+(e.place?'<div><span>Lieu</span><b>'+linkify(e.place)+'</b></div>':'')+(e.note?'<div><span>Info</span><b>'+linkify(e.note)+'</b></div>':'')+'</div>'+
  (bring.length?'<h3 class="psec">À apporter</h3><ul class="evlist">'+bring.map(function(x){return '<li>'+linkify(x)+'</li>'}).join('')+'</ul>':'')+
  (rem.length?'<h3 class="psec">Remarques</h3><ul class="evlist">'+rem.map(function(x){return '<li>'+linkify(x)+'</li>'}).join('')+'</ul>':'');
 if(editing) h+='<div class="editbox"><h4>Modifier l’activité</h4>'+
  '<label class="lbl">Titre<input id="ev-title" value="'+esc(e.title)+'"></label>'+
  '<div class="fields"><label class="lbl">Date<input id="ev-date" type="date" value="'+esc(e.date)+'"></label><label class="lbl">Fin (si plusieurs jours)<input id="ev-enddate" type="date" value="'+esc(e.endDate||'')+'"></label></div>'+
  '<div class="fields"><label class="lbl">Début<input id="ev-start" type="time" value="'+esc(e.time||'')+'"></label><label class="lbl">Fin<input id="ev-end" type="time" value="'+esc(e.end||'')+'"></label></div>'+
  '<div class="fields"><label class="lbl">Lieu<input id="ev-place" value="'+esc(e.place||'')+'"></label><label class="lbl">Info courte<input id="ev-note" value="'+esc(e.note||'')+'"></label></div>'+
  '<label class="lbl">À apporter (une chose par ligne)<textarea id="ev-bring" rows="3">'+esc(e.bring||'')+'</textarea></label>'+
  '<label class="lbl">Remarques (une par ligne)<textarea id="ev-rem" rows="3">'+esc(e.remarks||'')+'</textarea></label>'+
  '<div class="fields"><button class="btn" data-act="saveevent">Enregistrer</button><button class="btn danger" data-delevent="'+e.id+'">Supprimer l’activité</button></div></div>';
 return h+'</div></div>'}
function events(){
 var t=today(),up=S.events.filter(function(e){return evEnd(e)>=t}).sort(function(a,b){return a.date<b.date?-1:1}),past=S.events.filter(function(e){return evEnd(e)<t}).sort(function(a,b){return a.date<b.date?1:-1});
 function card(e,isPast,first){return evCard(e,isPast,first)}
 var h='<h2>À venir</h2>'+(up.length?up.map(function(e,i){return card(e,false,i===0)}).join(''):'<p class="empty">Rien de prévu pour l’instant.</p>');
 if(editing) h+='<div class="editbox"><h4>Ajouter une activité</h4><label class="lbl">Titre<input id="ne-title" placeholder="Ex. Camp d’hiver"></label><div class="fields"><label class="lbl">Date<input id="ne-date" type="date"></label><label class="lbl">Fin (si plusieurs jours)<input id="ne-enddate" type="date"></label></div><div class="fields"><label class="lbl">Début<input id="ne-time" type="time"></label><label class="lbl">Fin<input id="ne-end" type="time"></label></div><label class="lbl">Lieu<input id="ne-place"></label><div class="fields"><button class="btn" data-act="addevent">Ajouter</button></div><span class="meta">Ensuite tu pourras ajouter « À apporter » et les remarques.</span></div>';
 if(past.length) h+='<h2>Passées</h2>'+past.map(function(e){return card(e,true)}).join('');
 return h}

function histoire(){return '<h2>Histoire</h2><div class="soonbox"><span class="tcirc">📜</span><b>Bientôt disponible</b><span>L’histoire de la troupe arrive très bientôt.</span></div>'}

function settings(){return editing?'<div class="editbox" style="margin-top:28px"><h4>Infos de la troupe</h4><div class="fields"><input id="set-troop" value="'+esc(S.troop)+'" aria-label="Nom de la troupe"><input id="set-season" value="'+esc(S.season)+'" aria-label="Saison"><button class="btn ghost" data-act="details">Mettre à jour</button></div>'+(S.example?'<div class="fields"><button class="btn ghost" data-act="clear">Supprimer toutes les données d’exemple</button></div>':'')+'<span class="meta">Après « Publier », le site public troupeimpeesa.github.io se met à jour dans l’heure.</span></div>':''}

function render(){
 var app=document.getElementById('app');
 var keep=editing;
 var body=header()+(tab==='home'?home():tab==='points'?points():tab==='progress'?progress():tab==='history'?histoire():events())+(full?settings():'');
 editing=keep;
 if(openScout) body+=profile();
 if(openEvent) body+=eventPage();
 app.innerHTML=body+
  (canEdit&&!editing?'<button class="btn editbtn" data-act="edit">Modifier</button>':'')+
  (editing?'<div class="savebar"><span class="msg" role="status">'+esc(msg||(dirty?'Modifications non publiées':'Aucune modification'))+'</span><button class="btn ghost" data-act="done">'+(dirty?'Annuler':'Fermer')+'</button><button class="btn" data-act="publish"'+(dirty&&!saving?'':' disabled')+'>'+(saving?'Publication…':'Publier')+'</button></div>':'');
 var ind=document.getElementById('tab-ind');if(ind){requestAnimationFrame(function(){requestAnimationFrame(function(){ind.style.setProperty('--i',TABS.indexOf(tab));prevTab=tab})})}
}

function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
document.addEventListener('click',function(ev){
 if(ev.target.closest('a'))return;
 var b=ev.target.closest('button');
 if(!b){var pt=ev.target.closest('[data-ptab]');if(pt&&!ev.target.closest('input,select,textarea')){go('progress/pts-'+pt.dataset.ptab);window.scrollTo(0,document.querySelector('.tabbar').offsetTop);return}
  var evl=ev.target.closest('[data-event]');if(evl){go(tab+'/e-'+evl.dataset.event);var pr=document.querySelector('.profile');if(pr)pr.scrollTop=0}return}
 if(b.dataset.group){go('progress/g-'+b.dataset.group);window.scrollTo(0,document.querySelector('.tabbar').offsetTop);return}
 if(b.dataset.tab){prevTab=tab;try{history.replaceState(null,'','#'+b.dataset.tab)}catch(e){}route(b.dataset.tab);render();if(tab==='progress')leaderRun();return}
 msg='';
 if(b.dataset.delpatrol){S.patrols=S.patrols.filter(function(p){return p.id!==b.dataset.delpatrol});S.scouts=S.scouts.filter(function(s){return s.patrol!==b.dataset.delpatrol});return touch()}
 if(b.dataset.scout){go('progress/s-'+b.dataset.scout);var pr=document.querySelector('.profile');if(pr)pr.scrollTop=0;return}
 if(b.dataset.slide){showSlide(+b.dataset.slide);return}
 if(b.dataset.delphoto){S.photos=S.photos.filter(function(x){return x.id!==b.dataset.delphoto});return touch()}
 if(b.dataset.delday){var dd=b.dataset.delday;S.log=S.log.filter(function(l){return !(l.patrol===openPts&&l.date===dd)});return touch()}
 if(b.dataset.delnews){S.news=S.news.filter(function(x){return x.id!==b.dataset.delnews});return touch()}
 if(b.dataset.dellog){S.log=S.log.filter(function(l){return l.id!==b.dataset.dellog});return touch()}
 if(b.dataset.delscout){S.scouts=S.scouts.filter(function(s){return s.id!==b.dataset.delscout});return touch()}
 if(b.dataset.delevent){S.events=S.events.filter(function(e){return e.id!==b.dataset.delevent});if(openEvent===b.dataset.delevent){openEvent=null;try{history.replaceState(null,'','#'+tab)}catch(e){}}msg='Activité supprimée. Appuie sur Publier.';return touch()}
 if(b.dataset.att){var m=S.meetings.filter(function(x){return x.id===curM})[0];if(m){var k=m.present.indexOf(b.dataset.att);if(k>=0)m.present.splice(k,1);else m.present.push(b.dataset.att)}return touch()}
 if(b.dataset.delmeeting){S.meetings=S.meetings.filter(function(x){return x.id!==b.dataset.delmeeting});curM=null;return touch()}
 var a=b.dataset.act;
 if(a==='addmeeting'){var d=val('nm-date');if(!d){msg='Choisis la date de la réunion.';return render()}var nm={id:uid('m'),date:d,present:[]};S.meetings.push(nm);curM=nm.id;return touch()}
 if(a==='closeevent'){return closeView()}
 if(a==='saveevent'){var e=S.events.filter(function(x){return x.id===openEvent})[0];if(e){if(!val('ev-title')||!val('ev-date')){msg='Une activité a besoin d’un titre et d’une date.';return render()}e.title=val('ev-title');e.date=val('ev-date');e.endDate=val('ev-enddate')>e.date?val('ev-enddate'):'';e.time=val('ev-start');e.end=val('ev-end');e.place=val('ev-place');e.note=val('ev-note');e.bring=(document.getElementById('ev-bring')||{}).value||'';e.remarks=(document.getElementById('ev-rem')||{}).value||'';msg='Activité mise à jour. Appuie sur Publier.'}return touch()}
 if(a==='closegroup'){return closeView()}
 if(a==='addmeetpts'){var d=val('mp-date');if(!d){msg='Choisis la date de la réunion.';return render()}var any=false;CATS.forEach(function(c){var v=parseInt(val('mp-'+c[0]),10);if(v){S.log.push({id:uid('l'),patrol:openPts,cat:c[0],pts:v,reason:'',date:d});any=true}});if(!any){msg='Entre au moins un nombre de points.';return render()}msg='Points ajoutés. Appuie sur Publier.';return touch()}
 if(a==='closeprofile'){return closeView()}
 if(a==='delface'){delete S.faces[openScout];return touch()}
 if(a==='delcover'){S.cover='';return touch()}
 if(a==='addnews'){if(!val('nw-text')){msg='Écris d’abord le texte de l’annonce.';return render()}S.news.push({id:uid('n'),date:val('nw-date')||today(),text:val('nw-text')});msg='Annonce ajoutée. Appuie sur Publier.';return touch()}
 if(a==='edit'){editing=true;return render()}
 if(a==='done'){if(dirty){S=load();dirty=false;dropDraft()}editing=false;return render()}
 if(a==='restore'){var d=readDraft();if(d){try{var o=JSON.parse(d);DKEYS.forEach(function(k){if(k in o)S[k]=o[k]})}catch(e){}}draftAvail=false;editing=true;dirty=true;msg='Modifications récupérées. Appuie sur Publier.';return render()}
 if(a==='nodraft'){dropDraft();return render()}
 if(a==='award'){var n=parseInt(val('ap-pts'),10);if(!n||!val('ap-patrol')){msg='Entre d’abord un nombre de points.';return render()}S.log.push({id:uid('l'),patrol:val('ap-patrol'),cat:val('ap-cat'),pts:n,reason:val('ap-reason'),date:val('ap-date')||today()});return touch()}
 if(a==='addpatrol'){if(!val('np-name')){msg='Écris d’abord le nom de la patrouille.';return render()}var used=S.patrols.map(function(p){return p.c});var c=1;while(used.indexOf(c)>=0&&c<6)c++;S.patrols.push({id:uid('p'),name:val('np-name'),c:c});return touch()}
 if(a==='addscout'){if(!val('ns-name')||!val('ns-patrol')){msg='Écris un prénom et choisis une patrouille.';return render()}S.scouts.push({id:uid('s'),name:val('ns-name'),patrol:val('ns-patrol'),stage:0});return touch()}
 if(a==='stages'){var st=val('stages').split(',').map(function(s){return s.trim()}).filter(Boolean);if(st.length<2){msg='Ajoute au moins deux étapes.';return render()}S.stages=st;S.scouts.forEach(function(s){if(s.stage>=st.length)s.stage=st.length-1});return touch()}
 if(a==='addevent'){if(!val('ne-title')||!val('ne-date')){msg='Une activité a besoin d’un titre et d’une date.';return render()}var ne={id:uid('e'),title:val('ne-title'),date:val('ne-date'),endDate:val('ne-enddate')>val('ne-date')?val('ne-enddate'):'',time:val('ne-time'),end:val('ne-end'),place:val('ne-place'),note:'',bring:'',remarks:''};S.events.push(ne);msg='Activité ajoutée. Ajoute les détails puis appuie sur Publier.';dirty=true;saveDraft();go('events/e-'+ne.id);var pr=document.querySelector('.profile');if(pr)pr.scrollTop=pr.scrollHeight;return}
 if(a==='details'){S.troop=val('set-troop')||S.troop;S.season=val('set-season');return touch()}
 if(a==='clear'){S.log=[];S.events=[];S.example=false;return touch()}
 if(a==='publish'){publish()}
});
document.addEventListener('keydown',function(ev){var t=ev.target;if((ev.key==='Enter'||ev.key===' ')&&t.dataset&&t.dataset.event&&!t.closest('button')){ev.preventDefault();openEvent=t.dataset.event;render()}if(ev.key==='Escape'&&(openEvent||openScout||openGroup||openPts)){closeView()}});
window.addEventListener('popstate',function(){route();render()});
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(t.dataset.rename){var p=pat(t.dataset.rename);if(p&&t.value.trim()){p.name=t.value.trim();touch()}}
 if(t.id==='face-file'){var f2=t.files&&t.files[0];if(f2)shrink(f2,700,0.82).then(function(src){if(src){S.faces[openScout]=src;touch()}});return}
 if(t.id==='cv-file'){var f=t.files&&t.files[0];if(f)shrink(f,1800,0.8).then(function(src){if(src){S.cover=src;touch()}});return}
 if(t.id==='ph-file'){addPhotos(t.files);return}
 if(t.dataset.phcap){var ph=S.photos.filter(function(x){return x.id===t.dataset.phcap})[0];if(ph){ph.caption=t.value.trim();touch()}return}
 if(t.dataset.msel){curM=t.value;return render()}
 if(t.dataset.stage){var s=S.scouts.filter(function(x){return x.id===t.dataset.stage})[0];if(s){s.stage=+t.value;touch()}}
});

function buildDoc(){
 var reset=(document.head.querySelector('style')||{}).textContent||'';
 var st=JSON.stringify(Object.assign({},S,{example:S.example})).replace(/</g,'\\u003c');
 var title=document.querySelector('title');
 var link=document.querySelector('link[href*="fonts.googleapis"]');
 var styles=[].slice.call(document.querySelectorAll('body style')).map(function(s){return s.outerHTML}).join('');
 var main=document.getElementById('main').textContent;
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
  '<title>'+esc(S.troop||'Troupe Impeesa VPJ')+'</title>\n'+(link?link.outerHTML:'')+'\n'+styles+'\n<div class="wrap" id="app"></div>\n<script type="application/json" id="state">'+st+'<\/script>\n<script id="main">'+main+'<\/script></body></html>';
}
function publish(){
 if(!artifactNs){msg='La sauvegarde n’est pas disponible ici.';return render()}
 saving=true;msg='';render();
 artifactNs.publish(buildDoc()).then(function(){saving=false;dirty=false;msg='Publié';render()}).catch(function(e){
  saving=false;var c=e&&e.code;
  msg=c==='conflict'?'Quelqu’un a publié avant toi. La page va se recharger.':(c==='not_writer'||c==='not_granted')?'Tu peux voir cette page mais pas la modifier.':'Publication impossible. Vérifie ta connexion et réessaie.';
  render()});
}

render();
if(tab==='progress')setTimeout(leaderRun,400);
if(window.claude&&window.claude.use){
 window.claude.use('assets').then(function(ns){assetsNs=ns}).catch(function(){});
 window.claude.use('artifact').then(function(ns){
  artifactNs=ns; if(!ns) return;
  return window.claude.use('user').then(function(u){
   if(!u) return;
   Promise.resolve(u.isOwner()).then(function(v){full=!!v;canEdit=!!v;if(canEdit){var d=readDraft();if(d){if(d===pick(S))dropDraft();else draftAvail=true}}render()});
  });
 }).catch(function(){});
}
})();
</script>

</body>
